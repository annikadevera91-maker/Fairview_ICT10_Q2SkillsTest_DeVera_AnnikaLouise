<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT 10 - Non-Metal Elements Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body {
            background-color: #fffde7; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
        }
        h1 {
            color: #ec407a;
            font-weight: 800;
        }
        .main-card {
            background-color: #fff9c4; 
            border: 3px solid #f48fb1; 
            box-shadow: 0 10px 25px rgba(244, 143, 177, 0.25);
            border-radius: 15px;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
        }
        .header-box {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            color: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-custom {
            background-color: #f48fb1;
            border-color: #f48fb1;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-custom:hover {
            background-color: #ec407a;
            border-color: #ec407a;
            color: white;
        }
        .result-panel {
            background-color: #ffffff;
            border: 2px dashed #f48fb1;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container py-4 text-center">
        <h1>PRACTICE SET</h1>
        
        <div class="main-card">
            <div class="header-box text-center">
                <h2 class="mb-0 fw-bold">Non-Metal Elements</h2>
                <small class="text-white-50">Periodic Table Information Finder</small>
            </div>

            # Input form
            <div class="mb-3 text-start">
                <label for="element-code" class="form-label fw-bold text-secondary">Element Symbol</label>
                <input type="text" id="element-code" class="form-control form-control-lg bg-white" placeholder="Enter symbol here..." autocomplete="off">
            </div>

            #Search Button
            <button py-click="search_element" class="btn btn-custom w-100 py-2 shadow-sm">Check Details</button>

            # Results Panel
            <div class="result-panel shadow-sm">
                <h4 class="fw-bold text-secondary mb-3 border-bottom pb-2">Search Results</h4>
                <p class="mb-2"><strong>Symbol:</strong> <span id="symbol" class="text-dark">-</span></p>
                <p class="mb-2"><strong>Element Name:</strong> <span id="name" class="text-dark">-</span></p>
                <p class="mb-2"><strong>Atomic Number:</strong> <span id="atomic_number" class="text-dark">-</span></p>
                <p class="mb-0"><strong>Atomic Mass:</strong> <span id="atomic_mass" class="text-dark">-</span></p>
            </div>
        </div>
    </div>

# Links to separate Python file
    <script type="py" src="main.py"></script>

</body>
</html>
